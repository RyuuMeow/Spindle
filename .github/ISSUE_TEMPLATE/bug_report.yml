name: Bug report
description: Report a reproducible Spindle issue
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove private script text, credentials and personal paths before posting. Report security issues privately via SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Spindle version and build
      placeholder: "0.10.0 Portable or Setup"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "Use a disposable project if possible."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
